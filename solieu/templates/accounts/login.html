{% extends "base.html" %}

{% block title %}Đăng nhập — Tổng hợp số liệu{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title mb-3">Đăng nhập</h2>
          <form method="post" novalidate>
            {% csrf_token %}
            {% if form.non_field_errors %}
              <div class="alert alert-danger" role="alert">
                {{ form.non_field_errors }}
              </div>
            {% endif %}
            <div class="mb-3">
              <label class="form-label" for="{{ form.username.id_for_label }}">Tên đăng nhập</label>
              <input
                class="form-control"
                type="text"
                name="username"
                id="{{ form.username.id_for_label }}"
                autocomplete="username"
                autofocus
                required
              >
            </div>
            <div class="mb-3">
              <label class="form-label" for="{{ form.password.id_for_label }}">Mật khẩu</label>
              <input
                class="form-control"
                type="password"
                name="password"
                id="{{ form.password.id_for_label }}"
                autocomplete="current-password"
                required
              >
            </div>
            <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
