<svg class="portal-icon" width="{{ size|default:18 }}" height="{{ size|default:18 }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == "grid" %}
    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
  {% elif name == "users" %}
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
    <circle cx="9" cy="7" r="4"></circle>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
  {% elif name == "calendar" %}
    <rect x="3" y="5" width="18" height="16" rx="2"></rect>
    <path d="M16 3v4M8 3v4M3 11h18"></path>
  {% elif name == "layers" %}
    <path d="m12 2 9 5-9 5-9-5 9-5Z"></path>
    <path d="m3 12 9 5 9-5M3 17l9 5 9-5"></path>
  {% elif name == "database" %}
    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
    <path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"></path>
  {% elif name == "search" %}
    <circle cx="11" cy="11" r="7"></circle>
    <path d="m20 20-4-4"></path>
  {% elif name == "plus" %}
    <path d="M12 5v14M5 12h14"></path>
  {% elif name == "arrow" %}
    <path d="M5 12h14M13 6l6 6-6 6"></path>
  {% elif name == "chevron" %}
    <path d="m9 18 6-6-6-6"></path>
  {% elif name == "menu" %}
    <path d="M4 6h16M4 12h16M4 18h16"></path>
  {% elif name == "bell" %}
    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
    <path d="M10 21h4"></path>
  {% elif name == "home" %}
    <path d="m3 11 9-8 9 8"></path>
    <path d="M5 10v11h14V10M9 21v-7h6v7"></path>
  {% elif name == "lock" %}
    <rect x="4" y="10" width="16" height="11" rx="2"></rect>
    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
  {% elif name == "building" %}
    <path d="M3 21h18M6 21V3h12v18M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"></path>
  {% elif name == "target" %}
    <circle cx="12" cy="12" r="9"></circle>
    <circle cx="12" cy="12" r="5"></circle>
    <circle cx="12" cy="12" r="1"></circle>
  {% elif name == "activity" %}
    <path d="M3 12h4l3-8 4 16 3-8h4"></path>
  {% elif name == "file" %}
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
    <path d="M14 2v6h6M8 13h8M8 17h5"></path>
  {% elif name == "folder" %}
    <path d="M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>
  {% elif name == "clock" %}
    <circle cx="12" cy="12" r="9"></circle>
    <path d="M12 7v5l3 2"></path>
  {% elif name == "chart" %}
    <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>
  {% elif name == "x" %}
    <path d="M6 6l12 12M18 6 6 18"></path>
  {% endif %}
</svg>
