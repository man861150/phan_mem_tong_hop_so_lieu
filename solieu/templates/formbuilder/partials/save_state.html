<div id="save-state" class="designer-save" aria-live="polite">
  {% if error %}
    <span class="designer-save-error">Không lưu được. Thử lại.</span>
  {% else %}
    {% include "formbuilder/partials/icon.html" with name="clock" size=14 %}
    <span>Tự động lưu lúc {{ save_label }}</span>
  {% endif %}
</div>
