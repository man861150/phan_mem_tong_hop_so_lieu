{% if don_vi_error %}
  <p class="form-error" role="alert">{{ don_vi_error }}</p>
{% endif %}
{% if don_vi_notice %}
  <p class="form-notice" role="status">{{ don_vi_notice }}</p>
{% endif %}
{% for don_vi in don_vi_options %}
  <label class="choice-tile" for="don-vi-{{ don_vi.pk }}">
    <input class="choice-tile-input"
           id="don-vi-{{ don_vi.pk }}"
           type="checkbox"
           name="don_vi_phoi_hop"
           value="{{ don_vi.pk }}"{% if don_vi.pk in selected_don_vi_ids %} checked{% endif %}>
    <span class="choice-tile-label">{{ don_vi.ten_don_vi }}</span>
  </label>
{% empty %}
  <p class="form-hint">Chưa có đơn vị phối hợp.</p>
{% endfor %}
