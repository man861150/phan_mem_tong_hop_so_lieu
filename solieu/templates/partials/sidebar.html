<aside class="app-sidebar d-print-none" :class="{ 'is-open': navOpen }" aria-label="Menu chính">
  <div class="sidebar-brand">
    <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
    <div class="min-w-0">
      <strong class="brand-name">iHUB</strong>
      <small class="brand-sub">Tổng hợp số liệu</small>
    </div>
    <button type="button" class="sidebar-close lg:hidden" @click="navOpen = false" aria-label="Đóng menu">
      <svg class="size-5" aria-hidden="true"><use href="#icon-close"></use></svg>
    </button>
  </div>

  <nav class="sidebar-nav" aria-label="Điều hướng chính">
    <p class="sidebar-label">Tổng quan</p>
    {% for item in navigation %}
      {% if item.visible %}
        <a class="nav-item{% if item.active %} is-active{% endif %}"
           href="{{ item.url }}"
           {% if item.active %}aria-current="page"{% endif %}>
          <svg class="nav-icon" aria-hidden="true"><use href="#icon-{{ item.icon }}"></use></svg>
          <span>{{ item.label }}</span>
          {% if item.badge %}
            <span class="nav-badge" aria-label="{{ item.badge }} phiếu cần xử lý">{{ item.badge }}</span>
          {% endif %}
        </a>
      {% endif %}
    {% endfor %}
  </nav>

  {% if show_workflow_guide %}
    <div class="sidebar-footer">
      <a class="sidebar-help" href="{% url 'entry:quy_trinh' %}">
        <span class="sidebar-help-icon" aria-hidden="true">
          <svg class="size-5"><use href="#icon-guide"></use></svg>
        </span>
        <span class="sidebar-help-copy">
          <strong>Cần hỗ trợ?</strong>
          <span>Xem hướng dẫn sử dụng</span>
        </span>
        <svg class="sidebar-help-arrow" aria-hidden="true"><use href="#icon-arrow"></use></svg>
      </a>
    </div>
  {% endif %}
</aside>
