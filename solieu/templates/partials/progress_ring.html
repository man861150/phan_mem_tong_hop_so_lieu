<div class="progress-ring" role="img" aria-label="{{ percent|floatformat:1 }} phần trăm">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <circle class="progress-ring-track" cx="32" cy="32" r="28" pathLength="100"></circle>
    <circle class="progress-ring-value" cx="32" cy="32" r="28" pathLength="100" stroke-dasharray="{{ percent|floatformat:'2u' }} 100"></circle>
  </svg>
  <span class="progress-ring-label" aria-hidden="true">{{ percent|floatformat:1 }}</span>
</div>
