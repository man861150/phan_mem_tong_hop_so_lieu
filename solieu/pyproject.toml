[project]
name = "solieu"
version = "0.1.0"
description = "Data entry, aggregation, and reporting for the Ho Chi Minh City Innovation and Startup Center"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2.19,<5.3",
    "django-axes>=7",
    "django-environ>=0.11",
    "django-htmx>=1.21",
    "django-simple-history>=3.7",
    "docxtpl>=0.19",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# The formatter owns wrapping. E501 still fires on unsplittable Django paths.
ignore = ["E501"]
